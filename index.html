<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DG Multi Browser — Prototype</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0f1115;color:#f4f5f7;font-family:Arial,Helvetica,sans-serif}
header{height:64px;padding:10px 16px;display:flex;align-items:center;gap:12px;background:#171a21;border-bottom:1px solid #292e38}
.logo{font-weight:800;font-size:20px;letter-spacing:.3px}
.badge{font-size:12px;color:#aeb5c2;background:#232833;padding:5px 8px;border-radius:8px}
.toolbar{margin-left:auto;display:flex;gap:8px}
button,input{font:inherit}
button{border:1px solid #363d49;background:#242a34;color:#fff;border-radius:9px;padding:9px 12px;cursor:pointer}
button:hover{background:#2d3440}
main{padding:14px;max-width:1500px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(5,minmax(180px,1fr));gap:14px}
.phone{background:#171a20;border:1px solid #303641;border-radius:22px;padding:8px;box-shadow:0 8px 24px #0004;min-width:0}
.phone-top{display:flex;align-items:center;gap:6px;padding:5px 4px 8px}
.dot{width:8px;height:8px;border-radius:50%;background:#48d597}
.name{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{margin-left:auto;display:flex;gap:4px}
.actions button{padding:5px 7px;border-radius:7px;font-size:11px}
.urlbar{display:flex;gap:5px;margin-bottom:7px}
.urlbar input{width:100%;min-width:0;background:#0e1116;border:1px solid #343b47;color:#dfe3ea;border-radius:8px;padding:7px 8px;font-size:11px}
.screen{aspect-ratio:9/16;background:#fff;border-radius:15px;overflow:hidden;position:relative}
.screen iframe{width:100%;height:100%;border:0;background:white}
.blocked{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;background:#f5f6f8;color:#252a31;font-size:12px}
.blocked strong{display:block;margin-bottom:7px}
.status{font-size:10px;color:#7f8998;padding:7px 3px 2px;min-height:19px}
@media(max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(180px,1fr))}}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(150px,1fr));gap:9px}main{padding:9px}header{height:auto;flex-wrap:wrap}.toolbar{margin-left:0}}
@media(max-width:430px){.grid{grid-template-columns:1fr 1fr}.phone{border-radius:17px;padding:6px}.screen{border-radius:11px}}
</style>
</head>
<body>
<header>
  <div class="logo">DG Multi Browser</div>
  <div class="badge">10 màn hình</div>
  <div class="toolbar">
    <button id="reloadAll">↻ Tải lại tất cả</button>
    <button id="reset">Đặt lại</button>
  </div>
</header>
<main>
  <div id="grid" class="grid"></div>
</main>
<script>
const defaults=[
 "https://www.google.com","https://www.youtube.com","https://www.facebook.com",
 "https://www.tiktok.com","https://www.canva.com","https://github.com",
 "https://www.wikipedia.org","https://www.google.com/maps","https://news.google.com",
 "https://www.openai.com"
];

function safeUrl(v){
  v=v.trim();
  if(!v) return "";
  if(!/^https?:\\/\\//i.test(v)) v="https://"+v;
  try{return new URL(v).href}catch{return ""}
}
function card(i,url){
  const el=document.createElement("section");
  el.className="phone";
  el.innerHTML=`
    <div class="phone-top">
      <span class="dot"></span><span class="name">Màn hình ${i+1}</span>
      <div class="actions">
        <button type="button" data-reload title="Tải lại">↻</button>
      </div>
    </div>
    <div class="urlbar">
      <input aria-label="Địa chỉ web màn hình ${i+1}" value="${url}">
      <button type="button" data-go>Đi</button>
    </div>
    <div class="screen">
      <iframe title="Màn hình ${i+1}" src="${url}" loading="eager"></iframe>
      <div class="blocked"><div><strong>Website có thể chặn iframe</strong>Prototype vẫn giữ đúng vị trí màn hình. Bản app desktop thật sẽ dùng WebView/Chromium để mở website độc lập.</div></div>
    </div>
    <div class="status">Sẵn sàng</div>`;
  const input=el.querySelector("input"), iframe=el.querySelector("iframe"), status=el.querySelector(".status"), blocked=el.querySelector(".blocked");
  function go(){
    const u=safeUrl(input.value);
    if(!u){status.textContent="URL không hợp lệ";return}
    input.value=u; iframe.src=u; status.textContent=u;
  }
  el.querySelector("[data-go]").addEventListener("click",go);
  input.addEventListener("keydown",e=>{if(e.key==="Enter")go()});
  el.querySelector("[data-reload]").addEventListener("click",()=>{iframe.src=iframe.src;status.textContent="Đã tải lại"});
  iframe.addEventListener("load",()=>{status.textContent="Đã tải: "+(iframe.src||"")});
  iframe.addEventListener("error",()=>blocked.style.display="flex");
  return el;
}

const grid=document.getElementById("grid");
function render(){
  grid.innerHTML="";
  defaults.forEach((u,i)=>grid.appendChild(card(i,u)));
}
render();

document.getElementById("reloadAll").addEventListener("click",()=>{
  grid.querySelectorAll("iframe").forEach(f=>f.src=f.src);
});
document.getElementById("reset").addEventListener("click",render);
</script>
</body>
</html>
